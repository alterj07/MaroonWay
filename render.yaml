# Render blueprint: the whole of MaroonWay, both halves.
#
# Apply it from the dashboard with New > Blueprint, pointed at this repository.
# It creates two services, because they are different kinds of thing:
#
#   maroonway      the Next.js site (Node). What a student opens.
#   maroonway-api  the FastAPI backend (Python). What it reads from.
#
# The site talks to the API server-side only, so the API needs no CORS and the
# browser never sees its URL or tokens.
#
# Secrets marked `sync: false` are prompted for once and stored by Render;
# nothing sensitive is committed here. `generateValue: true` lets Render invent
# a secret, and `fromService` copies one service's value into the other -- which
# is how INTERNAL_TOKEN stays identical on both sides without anyone pasting it
# twice and getting it wrong.
services:
  # ---------------------------------------------------------------- frontend
  - type: web
    name: maroonway
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "24"
      # NextAuth refuses to run in production without this, and the whole site
      # 500s rather than degrading -- every page reads the session.
      - key: NEXTAUTH_SECRET
        generateValue: true
      # Must be the service's own public URL: the state cookie is set on this
      # host and Google returns to it, so a mismatch loses the cookie and every
      # sign-in fails with "State cookie was missing".
      - key: NEXTAUTH_URL
        value: https://maroonway.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Render supplies the API's hostname; src/lib/api.ts adds the scheme.
      - key: BACKEND_URL
        fromService:
          type: web
          name: maroonway-api
          property: host
      # The same value the API generated, copied across. This is what proves a
      # request carrying a student's identity came from the site.
      - key: INTERNAL_TOKEN
        fromService:
          type: web
          name: maroonway-api
          envVarKey: INTERNAL_TOKEN

  # ----------------------------------------------------------------- backend
  - type: web
    name: maroonway-api
    runtime: python
    rootDir: backend
    plan: free
    region: ohio
    buildCommand: pip install --upgrade pip && pip install .
    # One worker, deliberately. The hot cache is an in-process LRU warmed at
    # boot; a second worker would hold a second, independent copy and halve the
    # hit rate. Scale by moving the cache to Redis, not by adding workers.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.14"
      # Supabase, via the session pooler. The scheme must be
      # postgresql+asyncpg://, not postgresql://, or SQLAlchemy loads the
      # synchronous driver and the service will not start.
      - key: DATABASE_URL
        sync: false
      - key: INTERNAL_TOKEN
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: IMPORT_TOKEN
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: RMP_SCHOOL_ID
        value: "1003"
      # The free plan sleeps after 15 minutes idle, and a cold start pays for
      # this warm-up before serving. Keep it small there; raise it on a paid
      # instance, where the process stays alive and the cache stays hot.
      - key: CACHE_WARM_COUNT
        value: "10"
